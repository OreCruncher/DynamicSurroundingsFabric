plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Mods the development client plays with; a modpack run (-Ppack, scripts/modpack-fetch.py) leaves them to the pack,
    // which brings its own copy or none, so they are only compiled against there
    def devMod = rootProject.hasProperty('pack') ? 'compileOnly' : 'implementation'
    "$devMod" "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${rootProject.terrablender_version}"
    "$devMod" "com.github.glitchfiend:GlitchCore-neoforge:${minecraft_version}-${rootProject.glitchcore_version}"
    "$devMod" "com.github.glitchfiend:SereneSeasons-neoforge:${minecraft_version}-${rootProject.serene_seasons_version}"
    "$devMod" "com.github.glitchfiend:BiomesOPlenty-neoforge:${minecraft_version}-${rootProject.bop_version}"

    // Simple Voice Chat: its plugin API to compile the common classes against; the mod itself in the dev client only
    compileOnly "de.maxhenkel.voicechat:voicechat-api:$rootProject.voicechat_api_version"
    if (!rootProject.hasProperty('pack'))
        localRuntime "maven.modrinth:simple-voice-chat:${rootProject.voicechat_neoforge_version}"

    api("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.clothapi_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

// The class tweaker as NeoForge reads it, so there is one list. Development runs get the tweaker from Loom, but the
// jar has to carry this: remapJar's atAccessWideners made it up to 1.21.11, and there is no remapJar now.
def accessTransformer = tasks.register('accessTransformer') {
    def tweaker = rootProject.file('common/src/main/resources/dsurround.classtweaker')
    def output = layout.buildDirectory.dir('generated/accessTransformer')
    inputs.file tweaker
    outputs.dir output
    doLast {
        def modifiers = [:]
        tweaker.readLines().collect { it.trim() }
                .findAll { it && !it.startsWith('#') && !it.startsWith('classTweaker') }
                .each { line ->
                    def parts = line.split(/\s+/)
                    def target = parts[2].replace('/', '.')
                    if (parts[1] == 'field')
                        target += " ${parts[3]}"
                    else if (parts[1] == 'method')
                        target += " ${parts[3]}${parts[4]}"
                    modifiers[target] = parts[0] == 'mutable' || modifiers[target] == 'public-f' ? 'public-f' : 'public'
                }
        def file = output.get().file('META-INF/accesstransformer.cfg').asFile
        file.parentFile.mkdirs()
        file.text = modifiers.collect { target, modifier -> "$modifier $target" }.join('\n') + '\n'
    }
}

processResources {
    var expandProps = [
            version: project.version,
            mod_id: rootProject.name,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_author: rootProject.mod_author,
            mod_license: rootProject.mod_license,
            mod_issues_url: rootProject.mod_issues_url,
            mod_homepage_url: rootProject.mod_homepage_url
    ]

    inputs.properties(expandProps)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }

    // Read by the sound credits screen. In our own assets folder, not straight in assets, where Minecraft takes each
    // entry for a namespace and warns about one that isn't; lower case, as resource paths must be
    into("/assets/$rootProject.name") {
        from("$projectDir/../CREDITS.md")
        rename { 'credits.md' }
    }

    // MIT asks for the notice to go with every copy, decompiled ones included
    from("$projectDir/../LICENSE")

    from(accessTransformer)
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
