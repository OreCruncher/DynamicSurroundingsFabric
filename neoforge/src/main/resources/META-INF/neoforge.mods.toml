modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${mod_issues_url}"
displayURL="${mod_homepage_url}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
${mod_description}
'''
iconFile = "assets/dsurround/icon.png"
bannerFile = "assets/dsurround/icon.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.3.0,26.4)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,26.4)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[22.0.5,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "dsurround.mixins.json"
