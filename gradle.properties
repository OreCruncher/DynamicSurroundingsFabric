# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_name = Dynamic Surroundings
mod_description = Alters the fabric of Minecraft experience by weaving a tapestry of sound and visual effects
mod_version = 0.4.7
mod_author = OreCruncher
mod_license = MIT
mod_issues_url = https://github.com/OreCruncher/DynamicSurroundingsFabric/issues
mod_homepage_url = https://github.com/OreCruncher/DynamicSurroundingsFabric
mod_update_url = https://raw.githubusercontent.com/OreCruncher/DynamicSurroundingsFabric/main/versions.json
mod_discussions_url = https://github.com/OreCruncher/DynamicSurroundingsFabric/discussions
mod_curseforge_url = https://www.curseforge.com/minecraft/mc-mods/dynamic-surroundings
mod_modrinth_url = https://modrinth.com/mod/dynamicsurroundingsfabric
maven_group = org.orecruncher
archives_name = dynamicsurroundings
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Dependencies
architectury_api_version = 13.0.11
fabric_loader_version = 0.19.5
fabric_api_version = 0.116.15+1.21.1
neoforge_version = 21.1.249
glitchcore_version = 2.1.0.2
serene_seasons_version = 10.1.0.3
bop_version = 21.1.0.14
terrablender_version = 4.1.0.8
clothapi_version = 15.0.140
yacl_version = 3.8.2+1.21
# Simple Voice Chat's plugin API: compiled against, not shipped (voice chat provides it)
voicechat_api_version = 2.6.24
# Simple Voice Chat 1.21.1-2.6.24 (project 416089), in the dev clients only: its voices get enhanced sound processing
voicechat_fabric_file = 8928481
voicechat_neoforge_file = 8928478
modmenu_version = 11.0.4
# Twilight Forest, in the NeoForge dev client only, for testing a dimension that draws its own weather. CurseForge
# file id (project 227639) of 4.8.3345. Its Fabric build (a beta) doesn't run in the Fabric dev client.
twilightforest_neoforge_file = 7797302
# Astral Sorcery 2.0.1.20 (an alpha, hidden on CurseForge by default; project 241721), in the NeoForge dev client
# only: it draws its own night sky, cancelling vanilla's
astralsorcery_neoforge_file = 8985152
# ObserverLib (project 316833), which Astral Sorcery needs but doesn't declare; also an alpha
observerlib_neoforge_file = 8726128
# Simple Weather 1.0.13-hotfix (project 983390), in the NeoForge dev client only: it draws rain and snow as particles
# of its own, so the mod's particle weather stands aside for it
simpleweather_neoforge_file = 7436830
