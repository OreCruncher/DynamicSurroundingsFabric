plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// The resource packs in packs/ (a folder each, with its pack.mcmeta), zipped into build/libs beside the jars for
// release. Each zip is named after its folder, which the game shows as the pack's name. They aren't versioned with
// the mod: their pack.mcmeta says which game versions they suit.
def resourcePackDirs = file('packs').listFiles()
        .findAll { it.isDirectory() && new File(it, 'pack.mcmeta').isFile() }
        .sort { it.name }

// A pack's problems, each a line naming its file. The game reports none of them in a way anyone sees: a file that
// doesn't parse loses everything in it (a missing comma in Seasons' sound_factories.json left its music unplayed,
// the music manager flickering on missing_sound), and an OGG whose first stream isn't Vorbis plays silence with
// nothing logged (Canon in D, with the MP3's cover art carried over as a Theora stream).
def resourcePackProblems = { File dir ->
    def problems = []
    def rel = { File f -> dir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
    def gson = new com.google.gson.Gson()
    // Strict, as the game's reader is: a missing comma, a trailing one or anything after the end is an error
    def parse = { File f ->
        try {
            f.withReader('UTF-8') { r ->
                def reader = new com.google.gson.stream.JsonReader(r)
                reader.setLenient(false)
                def element = gson.getAdapter(com.google.gson.JsonElement).read(reader)
                if (reader.peek() != com.google.gson.stream.JsonToken.END_DOCUMENT)
                    throw new IOException('more after the end of the document')
                element
            }
        } catch (Exception e) {
            problems << "${rel(f)}: doesn't parse: ${e.message}"
            null
        }
    }
    def parsed = [:]
    dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
        if (f.name.endsWith('.json') || f.name.endsWith('.mcmeta'))
            parsed[f] = parse(f)
    }

    // pack.mcmeta: formats from 1.21.1's (34) on are read by 26.3 only with pack_format and supported_formats
    // beside min_format and max_format, as long as min_format is at or under 64, the last format without a minor part
    def mcmeta = parsed[new File(dir, 'pack.mcmeta')]?.getAsJsonObject()?.getAsJsonObject('pack')
    if (mcmeta == null) {
        problems << 'pack.mcmeta: no "pack" object'
    } else {
        ['min_format', 'max_format'].each { if (!mcmeta.has(it)) problems << "pack.mcmeta: no $it" }
        def min = mcmeta.get('min_format')
        def major = min == null ? null : (min.isJsonArray() ? min.getAsJsonArray().get(0).getAsInt() : min.getAsInt())
        if (major != null && major <= 64)
            ['pack_format', 'supported_formats'].each {
                if (!mcmeta.has(it)) problems << "pack.mcmeta: min_format $major needs $it as well, or 26.3 rejects the pack"
            }
    }

    def assets = new File(dir, 'assets')
    def namespaces = assets.isDirectory() ? assets.listFiles().findAll { it.isDirectory() }*.name as Set : [] as Set
    def splitId = { String id, String ns -> id.contains(':') ? id.split(':', 2) as List : [ns, id] }

    // Sound events and the files they play, from each namespace's sounds.json
    def events = [] as Set
    def soundsUnread = false
    def usedOggs = [] as Set
    namespaces.each { ns ->
        def soundsFile = new File(assets, "$ns/sounds.json")
        def sounds = parsed[soundsFile]
        soundsUnread |= soundsFile.isFile() && sounds == null
        if (sounds == null)
            return
        sounds.getAsJsonObject().entrySet().each { event ->
            events << "$ns:${event.key}".toString()
            event.value.getAsJsonObject().getAsJsonArray('sounds')?.each { s ->
                def name = s.isJsonPrimitive() ? s.getAsString() : s.getAsJsonObject().get('name')?.getAsString()
                def type = s.isJsonObject() && s.getAsJsonObject().has('type') ? s.getAsJsonObject().get('type').getAsString() : 'file'
                if (name == null || type != 'file')
                    return
                def (sns, path) = splitId(name, 'minecraft')
                if (!(sns in namespaces))
                    return
                def ogg = new File(assets, "$sns/sounds/${path}.ogg")
                usedOggs << ogg.canonicalFile
                if (!ogg.isFile())
                    problems << "${rel(soundsFile)}: ${event.key} plays $name, and ${rel(ogg)} doesn't exist"
            }
        }
    }

    // Sound factories name an event; biome acoustics name a factory
    def factories = [] as Set
    // A file that doesn't parse has its own line; what refers into it would only repeat it
    def unreadFactories = [] as Set
    namespaces.each { ns ->
        def factoriesFile = new File(assets, "$ns/dsconfigs/sound_factories.json")
        if (factoriesFile.isFile() && parsed[factoriesFile] == null)
            unreadFactories << ns
        parsed[factoriesFile]?.getAsJsonArray()?.each { e ->
            def o = e.getAsJsonObject()
            def location = o.get('location')?.getAsString()
            def event = o.get('soundEvent')?.getAsString()
            if (location != null && !factories.add(location))
                problems << "${rel(factoriesFile)}: $location is defined twice"
            if (event != null && !soundsUnread && splitId(event, 'minecraft')[0] in namespaces && !(event in events))
                problems << "${rel(factoriesFile)}: $location plays $event, which no sounds.json in the pack defines"
        }
    }
    def eachFactory
    eachFactory = { com.google.gson.JsonElement e, Closure action ->
        if (e == null || e.isJsonNull() || e.isJsonPrimitive())
            return
        if (e.isJsonArray()) {
            e.getAsJsonArray().each { eachFactory(it, action) }
            return
        }
        e.getAsJsonObject().entrySet().each { entry ->
            if (entry.key == 'factory' && entry.value.isJsonPrimitive())
                action(entry.value.getAsString())
            else
                eachFactory(entry.value, action)
        }
    }
    namespaces.each { ns ->
        def biomesFile = new File(assets, "$ns/dsconfigs/biomes.json")
        if (!unreadFactories.isEmpty())
            return
        eachFactory(parsed[biomesFile]) { String factory ->
            if (splitId(factory, 'minecraft')[0] in namespaces && !(factory in factories))
                problems << "${rel(biomesFile)}: $factory isn't in the pack's sound_factories.json"
        }
    }

    // Each OGG: one logical stream, Vorbis, and played by some event. The beginning-of-stream pages come first, each
    // holding its stream's identification header
    namespaces.each { ns ->
        def soundsDir = new File(assets, "$ns/sounds")
        if (!soundsDir.isDirectory())
            return
        soundsDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.ogg'))
                return
            if (!(f.canonicalFile in usedOggs))
                problems << "${rel(f)}: no sound event plays it"
            def codecs = []
            new DataInputStream(new BufferedInputStream(new FileInputStream(f))).withCloseable { input ->
                def header = new byte[27]
                while (true) {
                    try { input.readFully(header) } catch (EOFException ignored) { break }
                    if (new String(header, 0, 4, 'ISO-8859-1') != 'OggS') {
                        codecs << 'not an Ogg page'
                        break
                    }
                    if ((header[5] & 0x02) == 0)
                        break
                    def segments = new byte[header[26] & 0xFF]
                    input.readFully(segments)
                    def body = new byte[segments.collect { it & 0xFF }.sum(0) as int]
                    input.readFully(body)
                    def magic = new String(body, 0, Math.min(7, body.length), 'ISO-8859-1')
                    codecs << (magic == '\u0001vorbis' ? 'vorbis' : magic == '\u0080theora' ? 'theora'
                            : magic.startsWith('OpusHead') ? 'opus' : 'unknown')
                }
            }
            if (codecs != ['vorbis'])
                problems << "${rel(f)}: streams ${codecs ?: 'none'}, where the game plays only a lone Vorbis stream" +
                        " (re-encode with -map 0:a or -vn to drop cover art)"
        }
    }
    problems
}

def checkResourcePacks = tasks.register('checkResourcePacks') {
    group = 'verification'
    description = 'Checks each resource pack in packs/: its JSON parses, every reference resolves, every OGG is lone Vorbis'
    def marker = layout.buildDirectory.file('resource-pack-check.txt')
    inputs.files(resourcePackDirs).withPropertyName('packs')
    outputs.file(marker)
    doLast {
        def problems = resourcePackDirs.collectMany { dir -> resourcePackProblems(dir).collect { "${dir.name}/$it" } }
        if (!problems.isEmpty())
            throw new GradleException("Resource pack problems:\n  " + problems.join('\n  '))
        marker.get().asFile.text = resourcePackDirs*.name.join('\n') + '\n'
        logger.lifecycle("Resource packs checked: ${resourcePackDirs*.name.join(', ')}")
    }
}

def resourcePackZips = resourcePackDirs
        .collect { dir ->
            tasks.register("zipResourcePack${dir.name.replaceAll(/[^A-Za-z0-9]/, '')}", Zip) {
                description = "Zips the $dir.name resource pack into build/libs"
                dependsOn checkResourcePacks
                from dir
                archiveFileName = "${dir.name}.zip"
                destinationDirectory = layout.buildDirectory.dir('libs')
                // The same files give the same zip
                preserveFileTimestamps = false
                reproducibleFileOrder = true
                // After the platforms' syncs into build/libs, which keep what isn't their own jars anyway
                mustRunAfter subprojects.collect { it.tasks.matching { t -> t.name == 'copyJarToMain' } }
            }
        }
ext.resourcePackZips = resourcePackZips
tasks.register('zipResourcePacks') {
    group = 'build'
    description = 'Zips every resource pack in packs/ into build/libs'
    dependsOn resourcePackZips
}

// Every subproject is a Minecraft module except the annotation processor, which is plain Java used at build time
configure(subprojects.findAll { it.name != 'processor' }) {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-$minecraft_version"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.isxander.dev/releases" }
        // Simple Voice Chat's plugin API
        maven {
            url = "https://maven.maxhenkel.de/repository/public"
            content { includeGroup "de.maxhenkel.voicechat" }
        }
        // CurseForge files by project and file id, for mods only released there (Twilight Forest)
        maven {
            url = "https://cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        // Modrinth versions by project and version number (Simple Voice Chat for the dev clients)
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.register('copyJarToMain', Sync) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        if (project.name != "common" && project.name != "stubs") {
            // Only publish jars to the shared folder once the tests (all in common) have passed
            dependsOn ':common:test'
            // No remapJar on 26.2 (unobfuscated); the shaded jar is the one that ships
            from tasks.named('shadowJar')
            into "../build/libs"
            // Every loader syncs into the same folder: only replace this loader's jars for this Minecraft version
            def ownJars = "${base.archivesName.get()}-*"
            preserve {
                include '**'
                exclude ownJars
            }
        }
    }

    if (project.name != "common" && project.name != "stubs") {
        tasks.named('build') { finalizedBy 'copyJarToMain', ':zipResourcePacks', 'installResourcePacks' }
        // Through the script (this), not the project: Gradle 10 drops looking methods up in parent projects
        this.installResourcePacks(project)
        this.potatoRuns(project)
        this.benchJarExclusion(project)
        this.accessInJar(project)
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Dev clients that stand in for a low-end PC, to see what the mod's effects cost there (each also has an IDE run config):
//  - runClientPotatoCpu: a dual core with hyperthreading (4 logical CPUs, pinned on Windows by scripts/run-affinity.ps1)
//    and the launcher's default 2 GB heap
//  - runClientPotatoFill: a 3840x2160 window, about the load per pixel a GPU four times slower has at 1080p (screen
//    passes such as the ground fog cost by the pixel); F3 shows whether the window really got that size
//  - runClientPotato: both
// The IDE's run configs get the same arguments, but not the pinning: run scripts/run-affinity.ps1 by hand (see there).
// GPU clocks and the integrated GPU are set outside the build (nvidia-smi -lgc, Windows' graphics settings).
def potatoRuns(Project p) {
    def cpus = 4
    // Logical CPUs 0-3: two cores and their hyperthreads, as Windows numbers them
    def cpuMask = 0xF
    def cpuArgs = ["-XX:ActiveProcessorCount=$cpus", '-Xmx2G']
    def fillArgs = ['--width', '3840', '--height', '2160']
    def platform = p.name.capitalize()
    // The bench runs (scripts/bench/README.md) run a scenario, -Pscenario=<file>, in a run folder of their own
    def scenario = p.rootProject.findProperty('scenario')
    def scenarioPath = scenario ? p.rootProject.file(scenario).absolutePath : ''
    // A modpack run (scripts/modpack-fetch.py fetches one) uses the pack's folder, -Ppack=<slug>, with or without a
    // scenario, and the heap a pack of a hundred mods or more wants
    def pack = p.rootProject.findProperty('pack') ?: 'none'
    // The graphics API for any run, -PgraphicsBackend=vulkan or opengl: a launch argument, which the game doesn't
    // reset to its default after a failed start, as it does the option
    def graphicsBackend = p.rootProject.findProperty('graphicsBackend')
    if (graphicsBackend)
        p.loom.runs.client.programArgs '--graphicsBackend', graphicsBackend
    def variants = [
            clientPotatoCpu     : [label: 'potato CPU', vm: cpuArgs, program: [], pin: true],
            clientPotatoFill    : [label: 'potato fill', vm: [], program: fillArgs, pin: false],
            clientPotato        : [label: 'potato', vm: cpuArgs, program: fillArgs, pin: true],
            clientBench         : [label: 'bench', vm: [], program: [], pin: false, bench: true],
            clientBenchPotatoCpu: [label: 'bench, potato CPU', vm: cpuArgs, program: [], pin: true, bench: true],
            clientPack          : [label: 'modpack', vm: ['-Xmx8G'], program: [], pin: false, bench: true, pack: true]]

    p.loom.runs {
        variants.each { runName, v ->
            create(runName) {
                inherit p.loom.runs.client
                configName = "$platform Client ($v.label)"
                // A bench run needs its scenario from the command line
                ideConfigGenerated !v.bench
                // Finds the game's JVM for run-affinity.ps1
                vmArg "-Ddsurround.devRun=$runName"
                // Which garbage collector: -Pgc=zgc for ZGC, G1 otherwise
                if (p.rootProject.findProperty('gc') == 'zgc')
                    vmArg '-XX:+UseZGC'
                vmArgs v.vm
                programArgs v.program
                if (v.bench) {
                    runDir v.pack ? "run-pack/$pack" : 'run-bench'
                    vmArg "-Ddsurround.scenario=$scenarioPath"
                }
            }
        }
    }

    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    variants.each { runName, v ->
        if (!v.pin || !isWindows)
            return
        p.tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
            doFirst {
                def script = rootProject.file('scripts/run-affinity.ps1').absolutePath
                new ProcessBuilder('powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script,
                        '-Marker', "dsurround.devRun=$runName", '-Mask', "$cpuMask",
                        '-Since', "${System.currentTimeMillis()}")
                        .redirectErrorStream(true)
                        .redirectOutput(p.layout.buildDirectory.file("run-affinity-${runName}.log").get().asFile)
                        .start()
            }
        }
    }
}

// The resource packs' zips copied into each run folder's resourcepacks (run, run-bench and every run-pack/<slug>, the
// -Ppack one too), there to turn on in the game's pack screen: nothing turns them on, so bench runs are unchanged.
// Before every client run, and after a build for runs started from the IDE.
def installResourcePacks(Project p) {
    def zips = p.rootProject.files(p.rootProject.resourcePackZips)
    def install = p.tasks.register('installResourcePacks') {
        group = 'build'
        description = "Copies the resource packs in packs/ into the $p.name run folders"
        inputs.files zips
        doLast {
            def folders = ['run', 'run-bench'] as Set
            folders.addAll((p.file('run-pack').listFiles() ?: []).findAll { it.isDirectory() }.collect { "run-pack/$it.name" })
            folders << "run-pack/${p.rootProject.findProperty('pack') ?: 'none'}"
            folders.each { folder ->
                p.copy {
                    from zips
                    into p.file("$folder/resourcepacks")
                }
            }
            logger.lifecycle("Resource packs copied into ${folders.sort().join(', ')}")
        }
    }
    p.tasks.matching { it.name.startsWith('runClient') }.configureEach { dependsOn install }
}

// The development bench (common's org.orecruncher.dsurround.bench: scenario runs, /dsbench) is never published: left
// out of the jar, and the build fails if it gets in anyway
def benchJarExclusion(Project p) {
    def bench = 'org/orecruncher/dsurround/bench/'
    // Matched lazily: the platform's own build script makes it after this runs. No remapJar on 26.2: the shaded jar is
    // the one that ships
    p.tasks.matching { it.name == 'shadowJar' }.configureEach {
        exclude "${bench}**"
        doLast {
            def jar = archiveFile.get().asFile
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def found = zip.entries().find { it.name.startsWith(bench) }
                if (found)
                    throw new GradleException("$jar.name holds the development bench ($found.name)")
            }
        }
    }
}

// Development runs get dsurround.classtweaker from Loom, whatever the jar says, so nothing shows a jar that doesn't ask
// its loader for it, and the game crashes as it starts. Up to 1.21.11 remapJar added this; there is no remapJar now.
def accessInJar(Project p) {
    p.tasks.matching { it.name == 'shadowJar' }.configureEach {
        def fabric = p.name == 'fabric'
        doLast {
            def jar = archiveFile.get().asFile
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def metadata = zip.getInputStream(zip.getEntry(fabric ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml')).text
                def asked = metadata.contains(fabric ? '"accessWidener": "dsurround.classtweaker"' : 'META-INF/accesstransformer.cfg')
                def file = zip.getEntry(fabric ? 'dsurround.classtweaker' : 'META-INF/accesstransformer.cfg')
                if (!asked || file == null)
                    throw new GradleException("$jar.name doesn't apply the class tweaker")
            }
        }
    }
}
