plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Every subproject is a Minecraft module except the annotation processor, which is plain Java used at build time
configure(subprojects.findAll { it.name != 'processor' }) {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-$minecraft_version"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.isxander.dev/releases" }
        // Simple Voice Chat's plugin API
        maven {
            url = "https://maven.maxhenkel.de/repository/public"
            content { includeGroup "de.maxhenkel.voicechat" }
        }
        // CurseForge files by project and file id, for mods only released there (Twilight Forest)
        maven {
            url = "https://cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        // Modrinth versions by project and version number (Simple Voice Chat for the dev clients)
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.register('copyJarToMain', Sync) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        if (project.name != "common" && project.name != "stubs") {
            // Only publish jars to the shared folder once the tests (all in common) have passed
            dependsOn ':common:test'
            // No remapJar on 26.2 (unobfuscated); the shaded jar is the one that ships
            from tasks.named('shadowJar')
            into "../build/libs"
            // Every loader syncs into the same folder: only replace this loader's jars for this Minecraft version
            def ownJars = "${base.archivesName.get()}-*"
            preserve {
                include '**'
                exclude ownJars
            }
        }
    }

    if (project.name != "common" && project.name != "stubs") {
        tasks.named('build') { finalizedBy 'copyJarToMain' }
        potatoRuns(project)
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Dev clients that stand in for a low-end PC, to see what the mod's effects cost there (each also has an IDE run config):
//  - runClientPotatoCpu: a dual core with hyperthreading (4 logical CPUs, pinned on Windows by scripts/run-affinity.ps1)
//    and the launcher's default 2 GB heap
//  - runClientPotatoFill: a 3840x2160 window, about the load per pixel a GPU four times slower has at 1080p (screen
//    passes such as the ground fog cost by the pixel); F3 shows whether the window really got that size
//  - runClientPotato: both
// The IDE's run configs get the same arguments, but not the pinning: run scripts/run-affinity.ps1 by hand (see there).
// GPU clocks and the integrated GPU are set outside the build (nvidia-smi -lgc, Windows' graphics settings).
def potatoRuns(Project p) {
    def cpus = 4
    // Logical CPUs 0-3: two cores and their hyperthreads, as Windows numbers them
    def cpuMask = 0xF
    def cpuArgs = ["-XX:ActiveProcessorCount=$cpus", '-Xmx2G']
    def fillArgs = ['--width', '3840', '--height', '2160']
    def platform = p.name.capitalize()
    def variants = [
            clientPotatoCpu : [label: 'potato CPU', vm: cpuArgs, program: [], pin: true],
            clientPotatoFill: [label: 'potato fill', vm: [], program: fillArgs, pin: false],
            clientPotato    : [label: 'potato', vm: cpuArgs, program: fillArgs, pin: true]]

    p.loom.runs {
        variants.each { runName, v ->
            create(runName) {
                inherit p.loom.runs.client
                configName = "$platform Client ($v.label)"
                ideConfigGenerated true
                // Finds the game's JVM for run-affinity.ps1
                vmArg "-Ddsurround.devRun=$runName"
                vmArgs v.vm
                programArgs v.program
            }
        }
    }

    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    variants.each { runName, v ->
        if (!v.pin || !isWindows)
            return
        p.tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
            doFirst {
                def script = rootProject.file('scripts/run-affinity.ps1').absolutePath
                new ProcessBuilder('powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script,
                        '-Marker', "dsurround.devRun=$runName", '-Mask', "$cpuMask",
                        '-Since', "${System.currentTimeMillis()}")
                        .redirectErrorStream(true)
                        .redirectOutput(p.layout.buildDirectory.file("run-affinity-${runName}.log").get().asFile)
                        .start()
            }
        }
    }
}
