plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle(project(path: ':common')) {
        transitive = false
    }

    // Nashorn is intentionally not bundled. Dynamic Surroundings config predicates
    // are evaluated by the internal expression evaluator in the common project.

    // Optional GlitchFiend integrations are disabled for the 26.2 port until matching
    // 26.2 artifacts are available upstream.
    // implementation "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${rootProject.terrablender_version}"
    // implementation "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${rootProject.glitchcore_version}"
    // runtimeOnly "com.github.glitchfiend:SereneSeasons-fabric:${minecraft_version}-${rootProject.serene_seasons_version}"
    // runtimeOnly "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${rootProject.bop_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.clothapi_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
}

processResources {
    var expandProps = [
            version: project.version,
            mod_id: rootProject.name,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_author: rootProject.mod_author,
            mod_license: rootProject.mod_license,
            mod_issues_url: rootProject.mod_issues_url,
            mod_homepage_url: rootProject.mod_homepage_url
    ]

    inputs.properties(expandProps)

    filesMatching('fabric.mod.json') {
        expand expandProps
    }

    into('/') {
        from("$projectDir/../CREDITS.md")
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "module-info.class"
    exclude "META-INF/versions/**/module-info.class"
    // Safety guard: these must be supplied by the launcher/loader, never by this mod jar.
    exclude "net/fabricmc/loader/**"
    exclude "net/fabricmc/api/**"
    exclude "org/spongepowered/**"
    configurations = [project.configurations.shadowBundle]

    archiveClassifier = 'dev-shadow'
}

jar {
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(shadowJar.archiveFile.get().asFile) }
}
