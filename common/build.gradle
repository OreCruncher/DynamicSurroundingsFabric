architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Compile against Fabric Loader annotations only. Do not expose Fabric Loader as a
    // common runtime dependency, or platform shadow jars may accidentally bundle loader
    // implementation classes into the mod jar.
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // The 26.2 launch-safe port uses an internal expression evaluator instead of Nashorn.
    // Do not put Nashorn/ASM on the mod class path; those libraries can conflict with
    // Mixin/Sodium/Iris during startup.

    // 26.2 compatibility note: GlitchFiend optional integrations (GlitchCore/Serene Seasons)
    // did not have 26.2 artifacts available when this port was prepared. Keep these
    // disabled so the core client mod can compile against the 26.2 toolchain.
    // Re-enable when matching 26.2 artifacts are published and restore the Serene Seasons API adapter.
    // implementation "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${rootProject.glitchcore_version}"
    // runtimeOnly "com.github.glitchfiend:SereneSeasons-fabric:${minecraft_version}-${rootProject.serene_seasons_version}"

    // Referencing the Fabric project for API
    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.clothapi_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

loom {
    accessWidenerPath = file("src/main/resources/dsurround.classtweaker")
}

// 26.2 API compatibility: keep compiling the core client while the custom
// particle/fog renderer integrations are rebuilt for the new rendering stack.
sourceSets {
    main {
        java {
            exclude 'org/orecruncher/dsurround/effects/particles/DsurroundParticleRenderType.java'
            exclude 'org/orecruncher/dsurround/effects/particles/ParticleRenderCollection.java'
            exclude 'org/orecruncher/dsurround/processing/fog/BiomeFogRangeCalculator.java'
            exclude 'org/orecruncher/dsurround/processing/fog/HolisticFogRangeCalculator.java'
            exclude 'org/orecruncher/dsurround/processing/fog/IFogRangeCalculator.java'
            exclude 'org/orecruncher/dsurround/processing/fog/MorningFogRangeCalculator.java'
            exclude 'org/orecruncher/dsurround/processing/fog/VanillaFogRangeCalculator.java'
            exclude 'org/orecruncher/dsurround/processing/fog/WeatherFogRangeCalculator.java'
        }
    }
}
