architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // For some reason Fabric decorates some Minecraft classes so we need to make the compiler happy
    compileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    implementation "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${rootProject.glitchcore_version}"
    implementation "com.github.glitchfiend:SereneSeasons-fabric:${minecraft_version}-${rootProject.serene_seasons_version}"

    // Referencing the Fabric project for API
    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.clothapi_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    testImplementation "net.fabricmc:fabric-loader-junit:$rootProject.fabric_loader_version"
    testImplementation(project(path: ':common'))
}

loom {
    accessWidenerPath = file("src/main/resources/dsurround.classtweaker")
}

test {
    useJUnitPlatform()
    testLogging {
        outputs.upToDateWhen {false}
        showStandardStreams = true
        events = ['PASSED', 'FAILED', 'SKIPPED']
        exceptionFormat = 'FULL'
        showExceptions = true
        showCauses = true
        showStackTraces = true    }
}
